
name: Build Vibe Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VibeLauncher_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q VibeLauncher_Android_Project.zip -d project

      - name: Fix JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")
          files = list(root.rglob("*.gradle")) + list(root.rglob("*.gradle.kts"))

          for p in files:
              s = p.read_text()
              s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              s = s.replace("VERSION_1_8", "VERSION_17")
              s = s.replace('"1.8"', '"17"')
              s = s.replace("'1.8'", "'17'")
              p.write_text(s)
              print("Checked:", p)
          PY

      - name: Build APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VibeLauncher-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
